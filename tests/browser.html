    test('test Sleep in leaves saved alarm schedule untouched', data.music_test.status==='sleeping_in' && JSON.stringify(data.alarms)===alarmsBeforeMusic && data.revision===revisionBeforeMusic);
    await click('test'); data.music_test.status='uncertain'; push(); await flush();
    test('uncertain playback exposes guarded dismiss not another start', !!q('[data-action="music-dismiss"]') && !q('[data-action="music-start"]'));
    await click('music-dismiss');
    test('guarded dismiss sends no ordinary alarm action', calls.findLast((c) => c.type==='household_alarms/music_action').action==='dismiss' && data.music_test.status==='dismissed');
    test('music panel does not overflow on mobile', document.documentElement.scrollWidth <= window.innerWidth + 1);
    if (new URLSearchParams(location.search).has('music')) {
      card._draft=null; card._renderEditor(); card._openSections.add('music-test'); card._renderMusic();
      q('#music-test').scrollIntoView();
    }
    if (new URLSearchParams(location.search).has('preview')) await click('preview');
    if (new URLSearchParams(location.search).has('review')) {
      card._draft=null; card._edit(data.alarms[0]);
      card._draft.music_track_name='Example song — Example artist'; card._renderEditor();
      q('[data-field="music_enabled"]').closest('fieldset').id='music-review';
      if (new URLSearchParams(location.search).get('review')==='phone') {
        q('#music-review').removeAttribute('id');
        const phone=q('[data-field="phone_enabled"]').closest('fieldset');
        phone.id='music-review'; q('#editor form').append(phone);
      }
      const reviewStyle=document.createElement('style');
      reviewStyle.textContent='#editor form > :not(#music-review){display:none}#music-test{display:none}';
      card.shadowRoot.append(reviewStyle);
      window.scrollTo(0,0);
    }
    document.querySelector("#results").textContent=JSON.stringify({status:"PASS",count:results.length,tests:results});
  } catch (error) {
    document.querySelector("#results").textContent=JSON.stringify({status:"FAIL",count:results.length,error:error.stack,tests:results});
  }
})();
</script></body></html>
